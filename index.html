<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Žygių Maršrutų Piešimas</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="Untitled-1.css">
</head>
<body>

  <!-- AUTENTIFIKACIJOS LANGAS -->
  <div id="authContainer" class="auth-box">
    <h2 id="authTitle">Prisijungimas</h2>
    
    <form id="authForm">
      <div class="form-group">
        <label for="authEmail">El. paštas:</label>
        <input type="email" id="authEmail" required placeholder="pavyzdys@gmail.com">
      </div>
      
      <div class="form-group">
        <label for="authPassword">Slaptažodis:</label>
        <input type="password" id="authPassword" required placeholder="Bent 6 simboliai">
      </div>
      
      <button type="submit" id="authSubmitBtn">Prisijungti</button>
    </form>

    <div class="toggle-auth">
      <span id="toggleAuthText">Neturite paskyros?</span>
      <button id="toggleAuthBtn" type="button">Registruotis</button>
    </div>
  </div>

  <!-- PAGRINDINĖ PROGRAMOS SĄSAJA -->
  <div id="appContainer" class="hidden">
    <!-- Viršutinė juosta -->
    <header class="app-header">
      <div class="user-info">
        Prisijungęs vartotojas: <strong id="userEmailDisplay">-</strong>
      </div>
      <button id="logoutBtn" class="danger-btn">Atsijungti</button>
    </header>

    <div class="main-layout">
      <!-- Žemėlapis -->
      <div id="map"></div>

      <!-- Valdymo skydelis -->
      <aside class="sidebar">
        <button id="toggleMenuBtn" class="primary-btn">Piešimo meniu</button>

        <div id="drawMenu" class="menu-content hidden">
          <h3>Sukurti maršrutą</h3>
          
          <div class="form-group">
            <label for="lineName">Maršruto pavadinimas:</label>
            <input type="text" id="lineName" placeholder="Pvz.: Žygis miške">
          </div>

          <div class="form-group">
            <label>Pasirinkite spalvą:</label>
            <div id="colorPalette" class="color-palette"></div>
            <input type="color" id="customColor" value="#e6194B" style="margin-top: 8px; width: 100%;">
          </div>

          <button id="startDrawBtn" class="success-btn">Pradėti piešti</button>
          <button id="stopDrawBtn" class="warning-btn hidden">Baigti piešimą</button>

          <p id="status-text" class="status-msg"></p>
        </div>

        <hr>

        <!-- Išsaugotų maršrutų sąrašas -->
        <div class="routes-section">
          <h3>Mano maršrutai</h3>
          <div id="routesList" class="routes-list"></div>

          <div class="delete-section">
            <select id="deleteSelect">
              <option value="">-- Pasirinkite maršrutą --</option>
            </select>
            <button id="deleteSelectedBtn" class="danger-btn" style="width: 100%; margin-top: 8px;">Trinti pasirinktą</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
